[[blocks]]
kind = "table"
widths = [0.16, 0.84]
rows = [
  ["7. 임금", "1) {w_hour}시간급, {w_day}일급, {w_month}월급: {wage}원\n2) 상여금 및 수당: {bonus_yes}지급(상여금: {bonus}원, 수당: {allowance}원), {bonus_no}미지급\n* 수습기간 중 임금 ({prob_wage})원, 수습시작일부터 3개월 이내 근무기간 ({prob_period_wage})원\n* 근로시간에서 정한 시간을 넘는 연장근로에 대해 시간당 ({ot_hourly})원을 지급함.\n※ 야간근로(당일 22:00~다음날 06:00)에 대해서는 통상임금의 50%를 가산임금으로 지급해야 함(상시근로자 4인 이하 사업장에는 해당되지 않음)."],
  ["7. Payment", "1) Wage: {wage} won / ({w_hour}Hour /{w_day}Day /{w_month}Month)\n2) Bonus or extra pay: {bonus_yes}Paid, {bonus_no}Unpaid\nIf paid, (bonus: {bonus} won, extra pay: {allowance} won)\n* Wage during probation period: ({prob_wage})won, but for up to the first 3 months of probation period: ({prob_period_wage}) won\n* The employee will be paid at the overtime rate of ({ot_hourly}) won/hour.\n※ A Night shift (from 10PM to 6AM on the next day) will be paid 50% more than the employee's regular rate of pay (This is not applicable to businesses with 4 or less employees)."],
  ["8. 임금 지급일", "매월 ({payday})일 또는 매주 ({payweekday})요일. 다만, 임금 지급일이 공휴일인 경우에는 전날에 지급함."],
  ["8. Payment date", "Every ({payday})th day of the month or every ({payweekday} day) of the week. If the payment day falls on a holiday, the payment will be made one day before the holiday."],
  ["9. 지급방법", "{pay_direct}직접 지급, {pay_bank}통장 입금\n※ 사용자는 근로자 명의로 된 예금통장 및 도장을 관리해서는 안 됨."],
  ["9. Payment methods", "{pay_direct} In person, {pay_bank} By direct deposit transfer into the employee's account\n※ The employer will not retain the bank book and the seal of the employee."],
  ["10. 숙식제공", "1) 숙박시설 제공\n- 숙박시설 제공 여부: {acc_yes}제공 {acc_no}미제공\n제공 시, 숙박시설의 유형({acc_house}주택, {acc_goshiwon}고시원, {acc_officetel}오피스텔, {acc_lodging}숙박시설(여관, 호스텔, 펜션 등), {acc_container}컨테이너, {acc_panel}조립식 패널, {acc_building}사업장 건물, 기타 주택형태 시설({acc_other}))\n- 숙박시설 제공 시 근로자 부담금액: 매월 {acc_cost}원\n2) 식사 제공\n- 식사 제공 여부: 제공({meal_b}조식, {meal_l}중식, {meal_d}석식), {meal_no}미제공\n- 식사 제공 시 근로자 부담금액: 매월 {meal_cost}원\n※ 근로자의 비용 부담 수준은 사용자와 근로자 간 협의(신규 또는 재입국자의 경우 입국 이후)에 따라 별도로 결정."],
  ["10. Accommo-dations and Meals", "1) Provision of accommodation\n- Provision of accommodation: {acc_yes}Provided, {acc_no}Not provided\n(If provided, accommodation types: {acc_house}Detached houses, {acc_goshiwon}Goshiwans, {acc_officetel}Studio flats, {acc_lodging}Lodging facility (such as a motel, hostel, pension hotel, etc.), {acc_container}Container boxes {acc_panel}SIP panel constructions, {acc_building}Rooms within the business building – or specify other housing or boarding facilities {acc_other}.)\n- Cost of accommodation paid by employee: {acc_cost} won/month\n2) Provision of meals\n- Provision of meals: {meal_yes}Provided({meal_b}breakfast, {meal_l}lunch, {meal_d}dinner), {meal_no} Not provided\n- Cost of meals paid by employee: {meal_cost} won/month\n※ The amount of costs paid by employee, will be determined by mutual consultation between the employer and employee (Newcomers and re-entering employees will consult with their employers after arrival in Korea)."],
]


# 근로조건 표 (열: 항목 | 내용 | 주석). 4번 내용은 점선으로 나뉜 두 칸
[[blocks]]
kind = "table"
widths = [0.14, 0.6, 0.26]
rows = [
  ["1. 근로계약기간", { text = "- 신규 또는 재입국자: ({term_months}) 개월\n- 사업장변경자: {chg_sy}년 {chg_sm}월 {chg_sd}일 ~ {chg_ey}년 {chg_em}월 {chg_ed}일\n* 수습기간: {prob_yes}활용(입국일부터 {prob_1}1개월 {prob_2}2개월 {prob_3}3개월 [{prob_other_months}]개월), {prob_no}미활용\n※ 신규 또는 재입국자의 근로계약기간은 입국일부터 기산함(다만,「외국인근로자의 고용 등에 관한 법률」제18조의4제1항에 따라 재입국(성실재입국)한 경우는 입국하여 근로를 시작한 날부터 기산함).", colspan = 2 }],
  ["1. Term of Labor contract", { text = "- Newcomers or Re-entering employee: ({term_months}) month(s)\n- Employee who changed workplace: from ({chg_start_en} YY/MM/DD) to ({chg_end_en} YY/MM/DD)\n* Probation period: {prob_yes}Included (for {prob_1}1 month {prob_2}2 months {prob_3}3 months from entry date – or specify other: {prob_other}{prob_other_months}.), {prob_no}Not included.\n※ The employment term for newcomers and re-entering employees will begin on their date of arrival in Korea, while the employment of those who re-entered through the committed workers’ system will commence on their first day of work as stipulated in Article 18-4 (1) of Act on Foreign Workers` Employment, etc.", colspan = 2 }],
  ["2. 근로장소", { text = "※ 근로자를 이 계약서에서 정한 장소 외에서 근로하게 해서는 안 됨.", colspan = 2 }],
  ["2. Place of employment", { text = "※ The undersigned employee is not allowed to work apart from the contract enterprise.", colspan = 2 }],
  ["3. 업무내용", { text = "- 업종: {industry}\n- 사업내용: {business}\n- 직무내용:※ 외국인근로자가 사업장에서 실제 수행하게 될 구체적인 업무를 반드시 상세하게 기재합니다\n(예시, 딸기 재배, 돼지사육 및 축사관리, 어로작업 및 굴양식 등)\n{job_desc}", colspan = 2 }],
  ["3. Description of work", { text = "- Industry: {industry}\n- Business description: {business}\n- Job description: ※ Detailed duties and responsibilities of the employee must be stated.\n(e.g. strawberry growing, pig care and barn management, fishing and oyster farming, etc.)\n{job_desc}", colspan = 2 }],
  [{ text = "4. 근로시간", rowspan = 2 }, "- {work_sh}시 {work_sm}분 ~ {work_eh}시 {work_em}분 - 월 ({month_hours})시간", { text = "*「근로기준법」제63조에 따른 농림, 축산, 양잠, 수산 사업의 경우 같은 법에 따른 근로시간, 휴게, 휴일에 관한 규정은 적용받지 않음.\n*In pursuant to the Article 63 of the Labor Standards Act, working hours, recess hours, off-days are not applied to agriculture, forestry, livestock breeding, silk-raising farming and marine product businesses.", rowspan = 6 }],
  ["※ 농번기, 농한기(어업의 경우 성어기, 휴어기), 계절․기상 요인에 따라 ({var_hours})시간 내에서 변경 가능"],
  ["4. Working hours", "- Regular working hours: from {work_start_en} to {work_end_en} - ({month_hours}) hours/month\n※ Daily working hours are changeable up to ({var_hours}) hours depending on seasonal work availability and climate changes for the agriculture and fisheries industry (e.g. peak and off-seasons)"],
  ["5. 휴게시간", "1일 ({rest_count})회, ({rest_h})시간 ({rest_m})분"],
  ["5. Recess hours", "({rest_count}) times for a total of ({rest_h}) hour(s) ({rest_m}) minute(s) per day"],
  ["6. 휴일", "{hol_w1} 주1회, {hol_m1} 월1회, {hol_m2} 월2회, {hol_m3} 월3회, {hol_etc} 기타 ({hol_etc_text})\n※ 휴일은 정기적으로 부여하는 것을 원칙으로 하되, 당사자가 협의하여 날짜를 조정할 수 있음.\n농번기(성어기) : {peak_w1}주1회, {peak_m1}월1회, {peak_m2}월2회, {peak_m3}월3회, {peak_etc}기타({peak_etc_text})"],
  ["6. Holidays", { text = "{hol_w1} 1 time/week, {hol_m1} 1 time/month, {hol_m2} 2 times/month, {hol_m3} 3 times/month {hol_etc} etc. ({hol_etc_text})\n※ Holidays should be given on a regular basis, the employer and employee can change the date through consultation.\nPeak seasons : {peak_w1} 1 time/week, {peak_m1} 1 time/month, {peak_m2} 2 times/month, {peak_m3} 3 times/month, {peak_etc} etc. ({peak_etc_text})", colspan = 2 }],
]


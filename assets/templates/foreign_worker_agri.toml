# 외국인근로자 표준근로계약서(농업ㆍ축산업ㆍ어업 분야) [별지 제6호의2서식] — 원본 PDF 10~11쪽(앞·뒤), 레이아웃 C
# 고정 문구는 crates/synth/tests/templates.rs가 assets/forms/extracted/pages/page_10·11.txt와 대조한다.
# 스키마: crates/synth/src/template.rs / 항목·라벨 근거: docs/forms_inventory.md 2-3
#
# - foreign_worker.toml과 당사자 표·근로계약기간·숙식제공은 같고, 근로시간·휴게·휴일·임금 칸이 다르다
# - 4~6번 행 오른쪽 주석 칸(근로기준법 제63조 적용 제외)은 여러 행에 걸친 칸 → rowspan
# - 10쪽 굵은 한글 제목은 PDF에서 곡선이라 텍스트가 없음 (괄호·ㆍ만 텍스트) → meta.not_in_pdf

[meta]
id = "foreign_worker_agri"
title = "외국인근로자 표준근로계약서(농업ㆍ축산업ㆍ어업 분야) [별지 제6호의2서식]"
source_pages = [10, 11]
layouts = ["C"]
not_in_pdf = ["표준근로계약서(농업ㆍ축산업ㆍ어업 분야)"]

[slots]
# 사용자 — 사업주 쪽 라벨은 owner = "employer" (1-2 Q1)
employer_company = { gen = "company_name" }
employer_address = { gen = "address_ko", attribute = "workplace_address" }
employer_rep = { gen = "person_name_ko", label = "NAME", owner = "employer" }
employer_phone = { owner = "employer", choices = [
  { when = "individual", gen = "mobile_phone", label = "PHONE", ratio = "employer_phone_individual.mobile" },
  { when = "individual", gen = "company_phone", hard_negative = true, ratio = "employer_phone_individual.company" },
  { when = "corporation", gen = "company_phone", hard_negative = true },
] }
employer_id = { owner = "employer", choices = [
  { when = "individual", gen = "rrn", label = "RRN", ratio = "employer_id_individual.rrn" },
  { when = "individual", gen = "bizno", label = "BIZ_NO", ratio = "employer_id_individual.bizno" },
  { when = "corporation", gen = "bizno", hard_negative = true },
] }

# 근로자
worker_name = { gen = "person_name_en", label = "NAME", owner = "worker" }
worker_birth = { gen = "birth_date:foreign", label = "BIRTH_DATE", owner = "worker" }
worker_home_address = { gen = "address_foreign", label = "ADDRESS", owner = "worker" }

# 1. 근로계약기간
term_months = { gen = "number:contract_months" }
chg_sy = { gen = "date:change_start:year" }
chg_sm = { gen = "date:change_start:month" }
chg_sd = { gen = "date:change_start:day" }
chg_ey = { gen = "date:change_end:year" }
chg_em = { gen = "date:change_end:month" }
chg_ed = { gen = "date:change_end:day" }
chg_start_en = { gen = "date:change_start:ymd" }
chg_end_en = { gen = "date:change_end:ymd" }
prob_yes = { kind = "check", group = "probation", style = "bracket" }
prob_no = { kind = "check", group = "probation", style = "bracket" }
prob_1 = { kind = "check", group = "probation_len", style = "bracket", requires = "prob_yes" }
prob_2 = { kind = "check", group = "probation_len", style = "bracket", requires = "prob_yes" }
prob_3 = { kind = "check", group = "probation_len", style = "bracket", requires = "prob_yes" }
prob_other = { kind = "check", group = "probation_len", style = "bracket", requires = "prob_yes" }
prob_other_months = { gen = "number:probation_months", requires = "prob_other" }

# 3. 업무내용
industry = { gen = "industry:agri" }
business = { gen = "business_desc:agri" }
job_desc = { gen = "job_desc:agri" }

# 4. 근로시간 (월 단위)
work_sh = { gen = "time:work_start:hour" }
work_sm = { gen = "time:work_start:minute" }
work_eh = { gen = "time:work_end:hour" }
work_em = { gen = "time:work_end:minute" }
work_start_en = { gen = "time:work_start:hm" }
work_end_en = { gen = "time:work_end:hm" }
month_hours = { gen = "number:monthly_hours" }
var_hours = { gen = "number:seasonal_variation_hours" }

# 5. 휴게시간
rest_count = { gen = "number:rest_count" }
rest_h = { gen = "number:rest_hours" }
rest_m = { gen = "number:rest_minutes" }

# 6. 휴일 (평상시 / 농번기)
hol_w1 = { kind = "check", group = "holiday", style = "bracket" }
hol_m1 = { kind = "check", group = "holiday", style = "bracket" }
hol_m2 = { kind = "check", group = "holiday", style = "bracket" }
hol_m3 = { kind = "check", group = "holiday", style = "bracket" }
hol_etc = { kind = "check", group = "holiday", style = "bracket" }
hol_etc_text = { gen = "other_note:holiday", requires = "hol_etc" }
peak_w1 = { kind = "check", group = "peak_holiday", style = "bracket" }
peak_m1 = { kind = "check", group = "peak_holiday", style = "bracket" }
peak_m2 = { kind = "check", group = "peak_holiday", style = "bracket" }
peak_m3 = { kind = "check", group = "peak_holiday", style = "bracket" }
peak_etc = { kind = "check", group = "peak_holiday", style = "bracket" }
peak_etc_text = { gen = "other_note:peak_holiday", requires = "peak_etc" }

# 7. 임금 — SALARY는 준식별
w_hour = { kind = "check", group = "wage_unit", style = "bracket" }
w_day = { kind = "check", group = "wage_unit", style = "bracket" }
w_month = { kind = "check", group = "wage_unit", style = "bracket" }
wage = { gen = "won:wage", label = "SALARY", owner = "worker" }
bonus_yes = { kind = "check", group = "bonus", style = "bracket" }
bonus_no = { kind = "check", group = "bonus", style = "bracket" }
bonus = { gen = "won:bonus", label = "SALARY", owner = "worker", requires = "bonus_yes" }
allowance = { gen = "won:allowance", label = "SALARY", owner = "worker", requires = "bonus_yes" }
prob_wage = { gen = "won:probation", label = "SALARY", owner = "worker" }
prob_period_wage = { gen = "won:probation_3m", label = "SALARY", owner = "worker" }
ot_hourly = { gen = "won:overtime_hourly", label = "SALARY", owner = "worker" }

# 8·9. 지급일·지급방법
payday = { gen = "number:day_of_month" }
payweekday = { gen = "weekday" }
pay_direct = { kind = "check", group = "pay_method", style = "bracket" }
pay_bank = { kind = "check", group = "pay_method", style = "bracket" }

# 10. 숙식제공
acc_yes = { kind = "check", group = "accommodation", style = "bracket" }
acc_no = { kind = "check", group = "accommodation", style = "bracket" }
acc_house = { kind = "check", group = "accommodation_type", style = "bracket", requires = "acc_yes" }
acc_goshiwon = { kind = "check", group = "accommodation_type", style = "bracket", requires = "acc_yes" }
acc_officetel = { kind = "check", group = "accommodation_type", style = "bracket", requires = "acc_yes" }
acc_lodging = { kind = "check", group = "accommodation_type", style = "bracket", requires = "acc_yes" }
acc_container = { kind = "check", group = "accommodation_type", style = "bracket", requires = "acc_yes" }
acc_panel = { kind = "check", group = "accommodation_type", style = "bracket", requires = "acc_yes" }
acc_building = { kind = "check", group = "accommodation_type", style = "bracket", requires = "acc_yes" }
acc_other = { gen = "other_note:accommodation", requires = "acc_yes" }
acc_cost = { gen = "won:accommodation_cost", requires = "acc_yes" }
meal_yes = { kind = "check", group = "meal", style = "bracket" }
meal_no = { kind = "check", group = "meal", style = "bracket" }
meal_b = { kind = "check", group = "meal_type", style = "bracket", multi = true, requires = "meal_yes" }
meal_l = { kind = "check", group = "meal_type", style = "bracket", multi = true, requires = "meal_yes" }
meal_d = { kind = "check", group = "meal_type", style = "bracket", multi = true, requires = "meal_yes" }
meal_cost = { gen = "won:meal_cost", requires = "meal_yes" }

contract_y = { gen = "date:contract:year" }
contract_m = { gen = "date:contract:month" }
contract_d = { gen = "date:contract:day" }
contract_en = { gen = "date:contract:ymd" }


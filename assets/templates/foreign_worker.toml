# 근로조건 표 (열: 항목 | 내용 | 주석)
[[blocks]]
kind = "table"
widths = [0.14, 0.58, 0.28]
rows = [
  ["1. 근로계약기간", { text = "- 신규 또는 재입국자: ({term_months}) 개월\n- 사업장변경자: {chg_sy}년 {chg_sm}월 {chg_sd}일 ~ {chg_ey}년 {chg_em}월 {chg_ed}일\n* 수습기간: {prob_yes}활용(입국일부터 {prob_1}1개월 {prob_2}2개월 {prob_3}3개월 [{prob_other_months}]개월) {prob_no}미활용\n※ 신규 또는 재입국자의 근로계약기간은 입국일부터 기산함(다만,「외국인근로자의 고용 등에 관한 법률」제18조의4제1항에 따라 재입국(성실재입국)한 경우는 입국하여 근로를 시작한 날부터 기산함).", colspan = 2 }],
  ["1. Term of Labor contract", { text = "- Newcomers or Re-entering employee: ({term_months}) month(s)\n- Employee who changed workplace: from ({chg_start_en} YY/MM/DD) to ({chg_end_en} YY/MM/DD)\n* Probation period: {prob_yes} Included (for {prob_1} 1 month {prob_2} 2 months {prob_3} 3 months from entry date – or specify other: {prob_other}{prob_other_months}.), {prob_no} Not included\n※ The employment term for newcomers and re-entering employees will begin on their date of arrival in Korea, while the employment of those who re-entered through the committed workers’ system will commence on their first day of work as stipulated in Article 18-4 (1) of Act on Foreign Workers` Employment, etc.", colspan = 2 }],
  ["2. 근로장소", { text = "※ 근로자를 이 계약서에서 정한 장소 외에서 근로하게 해서는 안 됨.", colspan = 2 }],
  ["2. Place of employment", { text = "※ The undersigned employee is not allowed to work apart from the contract enterprise.", colspan = 2 }],
  ["3. 업무내용", { text = "- 업종: {industry}\n- 사업내용: {business}\n- 직무내용: {job_desc} (외국인근로자가 사업장에서 수행할 구체적인 업무를 반드시 기재)", colspan = 2 }],
  ["3. Description of work", { text = "- Industry: {industry}\n- Business description: {business}\n- Job description: {job_desc} (Detailed duties and responsibilities of the employee must be stated)", colspan = 2 }],
  ["4. 근로시간", "{work_sh}시 {work_sm}분 ~ {work_eh}시 {work_em}분\n- 1일 평균 시간외 근로시간: {ot_daily}시간\n(사업장 사정에 따라 변동 가능: {ot_max}시간 이내)\n- 교대제 ({shift_22}2조2교대, {shift_33}3조3교대, {shift_43}4조3교대, {shift_etc}기타)", { text = "※ 가사사용인, 개인간병인의 경우에는 기재를 생략할 수 있음.\n※ An employer of workers in domestic help, nursing can omit the working hours.", rowspan = 4 }],
  ["4. Working hours", "from ({work_start_en}) to ({work_end_en})\n- average daily over time: {ot_daily} hours\n(changeable depending on the condition of a company): up to {ot_max} hours)\n- shift system ({shift_22}2groups 2shifts, {shift_33}3groups 3shifts, {shift_43}4groups 3shifts, {shift_etc}etc.)"],
  ["5. 휴게시간", "1일 {rest_min}분"],
  ["5. Recess hours", "({rest_min}) minutes per day"],
  ["6. 휴일", { text = "{hol_sun}일요일 {hol_legal}공휴일({hol_paid}유급 {hol_unpaid}무급)\n{hol_sat}매주 토요일 {hol_altsat}격주 토요일, {hol_etc}기타({hol_etc_text})", colspan = 2 }],
  ["6. Holidays", { text = "{hol_sun}Sunday {hol_legal}Legal holiday({hol_paid}Paid {hol_unpaid}Unpaid)\n{hol_sat}Every saturday {hol_altsat}Every other Saturday {hol_etc}etc.({hol_etc_text})", colspan = 2 }],
]


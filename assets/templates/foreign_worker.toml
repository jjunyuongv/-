  ["성명 Name of the employer {employer_rep}", "사업자등록번호(주민등록번호)\nIdentification number {employer_id}"],
  [{ text = "근로자\nEmployee", rowspan = 2 }, "성명 Name of the employee {worker_name}", "생년월일 Birthdate {worker_birth}"],

[[blocks]]
kind = "table"
widths = [0.16, 0.84]
rows = [
  ["7. 임금", "1) 월 통상임금 ({wage_monthly})원\n- 기본급[(월, 시간, 일, 주)급] ({base_pay})원\n- 고정적 수당: ({fixed1_name} 수당 : {fixed1}원), ({fixed2_name} 수당: {fixed2}원)\n- 상여금 ({bonus}원)\n* 수습기간 중 임금 ({prob_wage})원, 수습시작일부터 3개월 이내 근무기간 ({prob_period_wage})원\n2) 연장, 야간, 휴일근로에 대해서는 통상임금의 50%를 가산하여 수당 지급(상시 근로자 4인 이하 사업장에는 해당되지 않음)"],
  ["7. Payment", "1) Monthly Normal wages ({wage_monthly})won\n- Basic pay[(Monthly, hourly, daily, weekly) wage] ({base_pay})won\n- Fixed benefits: ({fixed1_name} fixed benefits : {fixed1})won, ({fixed2_name} fixed benefits : {fixed2})won\n- Bonus: ({bonus})won\n* Wage during probation period: ({prob_wage})won, but for up to the first 3 months of probation period: ({prob_period_wage}) won\n2) Overtime, night shift or holiday will be paid 50% more than the employee’s regular rate of pay(not applied to business with 4 or less employees)."],
  ["8. 임금지급일", "매월 ({payday})일 또는 매주 ({payweekday})요일. 다만, 임금 지급일이 공휴일인 경우에는 전날에 지급함."],
  ["8. Payment date", "Every ({payday})th day of the month or every ({payweekday} day) of the week. If the payment date falls on a holiday, the paymenvery week.t will be made on the day before the holiday."],
  ["9. 지급방법", "{pay_direct}직접 지급, {pay_bank}통장 입금\n※ 사용자는 근로자 명의로 된 예금통장 및 도장을 관리해서는 안 됨."],
  ["9. Payment methods", "{pay_direct}In person, {pay_bank}By direct deposit transfer into the employee's account\n※ The employer will not retain the bank book and the seal of the employee."],
  ["10. 숙식제공", "1) 숙박시설 제공\n- 숙박시설 제공 여부: {acc_yes}제공 {acc_no}미제공\n제공 시, 숙박시설의 유형({acc_house}주택, {acc_goshiwon}고시원, {acc_officetel}오피스텔, {acc_lodging}숙박시설(여관, 호스텔, 펜션 등), {acc_container}컨테이너, {acc_panel}조립식 패널, {acc_building}사업장 건물, 기타 주택형태 시설({acc_other}))\n- 숙박시설 제공 시 근로자 부담금액: 매월 {acc_cost}원\n2) 식사 제공\n- 식사 제공 여부: 제공({meal_b}조식, {meal_l}중식, {meal_d}석식) {meal_no}미제공\n- 식사 제공 시 근로자 부담금액: 매월 {meal_cost}원\n※ 근로자의 비용 부담 수준은 사용자와 근로자 간 협의(신규 또는 재입국자의 경우 입국 이후)에 따라 별도로 결정."],
  ["10. Accommo-dations and Meals", "1) Provision of accommodation\n- Provision of accommodation: {acc_yes}Provided, {acc_no}Not provided\n(If provided, type of accommodations: {acc_house}Detached houses, {acc_goshiwon}Goshiwans, {acc_officetel}Studio flats, {acc_lodging}Lodging facility (such as a motel, hostel, pension hotel, etc.), {acc_container}Container boxes {acc_panel}SIP panel constructions, {acc_building}Rooms within the business building – or specify other housing or boarding facilities {acc_other}.)\n- Cost of accommodation paid by employee: {acc_cost} won/month\n2) Provision of meals\n- Provision of meals: {meal_yes}Provided({meal_b}breakfast, {meal_l}lunch, {meal_d}dinner), {meal_no} Not provided\n- Cost of meals paid by employee: {meal_cost} won/month\n※ The amount of costs paid by employee, will be determined by mutual consultation between the employer and employee (Newcomers and re-entering employees will consult with their employers after arrival in Korea)."],
]

[[blocks]]
kind = "paragraph"
text = "11. 사용자와 근로자는 각자가 근로계약, 취업규칙, 단체협약을 지키고 성실하게 이행하여야 한다."

[[blocks]]
kind = "paragraph"
text = "11. Both employees and employers shall comply with collective agreements, rules of employment, and terms of labor contracts and be obliged to fulfill them in good faith."

[[blocks]]
kind = "paragraph"
text = "12. 이 계약에서 정하지 않은 사항은 「근로기준법」에서 정하는 바에 따른다."

[[blocks]]
kind = "paragraph"
text = "※ 가사서비스업 및 개인간병인에 종사하는 외국인근로자의 경우 근로시간, 휴일ㆍ휴가, 그 밖에 모든 근로조건에 대해 사용자와 자유롭게 계약을 체결하는 것이 가능합니다."
indent = 1

[[blocks]]
kind = "paragraph"
text = "12. Other matters not regulated in this contract will follow provisions of the Labor Standards Act."

[[blocks]]
kind = "paragraph"
text = "※ The terms and conditions of the labor contract for employees in domestic help and nursing can be freely decided through the agreement between an employer and an employee."
indent = 1


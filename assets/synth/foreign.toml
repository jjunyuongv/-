# 외국인 근로자 자료 (3단계 가짜 PII, 레이아웃 C). 스키마·로딩: crates/synth/src/fake/data.rs
#
# - 고용허가제 주요 송출국 위주. 이름은 실제 인명 목록이 아니라 그 나라에서 흔한 이름 조각의 조합
# - **이름 순서는 국가별** (`order`): 베트남·캄보디아·우즈베키스탄은 성이 앞, 필리핀·인도네시아·네팔·태국은 이름이 앞,
#   미얀마는 성이 없음. 표기는 **영문 대문자**가 기본 (여권 표기와 같게)
# - 성별에 따라 달라지는 조각은 `*_male`·`*_female`로 둔다 (베트남 VAN/THI, 우즈베키스탄 -OV/-OVA 등)
# - `passport`: 여권번호 형식. L = 영문 대문자, # = 숫자 (형식 근사치 — 실제 발급 규칙 전부를 반영하지는 않음)
# - `address`: 본국 주소 형식. {num} 번지, {n} 작은 수, {province} 주·도 (주·도 이름은 실제, 나머지는 무작위)
# - `nationality`: 국적 (라벨 JSON 참고 항목 `nationality`)


# 국내 주소 자료 (3단계 가짜 PII). 스키마·로딩: crates/synth/src/fake/data.rs
#
# 출처: 행정안전부 도로명주소 한글 전체분 TXT (rnaddrkor_*.txt, CP949), 다운로드 2026-11-08
#   원본은 assets/synth/source/juso_20261108/ (개발용 자료, 앱에 넣지 않음, git 제외)
# 추출 규칙 (2026-11-08):
#   - 시·군·구: 기존 손 목록 27곳 (화성시는 공식 자료에서 구로 나뉘어 그 구들로 바꿈)
#   - 시·도 이름은 공식 자료 기준: 광주광역시·전라남도 → 전남광주통합특별시. 약칭은 아직 확정되지 않아 sido_short를 비움
#     (약식 표기에도 정식 명칭). 약칭이 확정되면 sido_short를 넣어 표기 변형으로 추가
#   - 도로: 시·군·구마다 건물 수 상위 30개 + 읍·면 지역 도로 10개 (농업·건설 업종용)
#   - areas: 그 도로에 실제로 건물이 있는 법정동·읍·면 (건물 수 상위 5개) → 도로가 없는 동이 붙지 않음
#   - max_no: 그 도로의 지상 건물본번 최댓값 (생성기는 1..=max_no에서 무작위 — 실제 건물과 같을 수 있으나 사람과 연결되지 않는 합성 값)
# 읍·면 지역 주소는 '시·도 시·군 읍·면 도로명 번호' 형식 (참고항목에 동 없음)

